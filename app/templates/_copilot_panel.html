<div id="copilot-root" class="copilot-root">
  <button id="copilot-open" class="copilot-fab" type="button" aria-controls="copilot-panel" aria-expanded="false"><span aria-hidden="true">✦</span> <span data-copilot-i18n="copilot_button">Copilot</span></button>
  <div id="copilot-backdrop" class="copilot-backdrop" hidden></div>
  <aside id="copilot-panel" class="copilot-panel" role="dialog" aria-modal="true" aria-labelledby="copilot-title" hidden tabindex="-1">
    <header class="copilot-panel-header"><div><h2 id="copilot-title" data-copilot-i18n="copilot_panel_title">HeatShield Copilot</h2><p id="copilot-context" class="copilot-context"></p></div><button id="copilot-close" class="copilot-icon-button" type="button" data-copilot-i18n-aria-label="copilot_close" aria-label="Close Copilot">×</button></header>
    <section class="copilot-examples" aria-labelledby="copilot-examples-title"><h3 id="copilot-examples-title" data-copilot-i18n="copilot_examples">Example questions</h3><div id="copilot-example-list" class="copilot-chip-list"></div></section>
    <ol id="copilot-conversation" class="copilot-conversation" aria-label="Copilot conversation" data-copilot-i18n-aria-label="copilot_conversation" aria-live="polite"></ol>
    <p id="copilot-error" class="copilot-error" role="alert" hidden></p><button id="copilot-retry" class="secondary-button copilot-retry" type="button" hidden data-copilot-i18n="copilot_retry">Retry</button>
    <form id="copilot-form" class="copilot-form" novalidate><label for="copilot-input" data-copilot-i18n="copilot_input_label">Ask Copilot</label><textarea id="copilot-input" maxlength="500" rows="3" data-copilot-i18n-placeholder="copilot_input_placeholder" placeholder="Ask about the current model results"></textarea><div class="copilot-form-actions"><output id="copilot-counter">0/500</output><button id="copilot-send" class="primary-button" type="submit" data-copilot-i18n="copilot_send">Send</button></div><button id="copilot-clear" class="copilot-clear" type="button" data-copilot-i18n="copilot_clear">Clear conversation</button></form>
    <footer class="copilot-footer" data-copilot-i18n="copilot_footer">Copilot explains model results; it does not diagnose or give medical advice.</footer>
  </aside>
</div>
